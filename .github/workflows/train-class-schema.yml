name: Collect pristine class schema dependencies
on: [workflow_dispatch]
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check schema tracing and selector safety
        run: python -m unittest test_selector test_class_attributes
      - name: Collect only from unmodified pinned source
        run: timeout 600 docker build --progress plain -f Dockerfile.training -t blast-schema .
      - name: Export generated pristine index
        run: docker run --rm --network none --read-only --user nobody --entrypoint cat blast-schema /app/index.json.gz > class-index.json.gz
      - name: Select public sample under runtime constraints
        run: /usr/bin/time -v docker run --rm --network none --cpus 2 --memory 4g --memory-swap 4g --read-only --tmpfs /tmp:rw,size=64m --user nobody -e HOME=/tmp -v "$PWD/sample/tests.json:/data/tests.json:ro" -v "$PWD/sample/commits:/data/commits:ro" blast-schema > class-predictions.jsonl
      - name: Validate sample externally
        run: python score.py sample sample/answers.json class-predictions.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-schema-index
          path: |
            class-index.json.gz
            class-predictions.jsonl
